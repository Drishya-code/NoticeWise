<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
 <title id="title">NoticeWise architecture</title><desc id="desc">Local app flow: browser sends notice text or an image to a local Node.js server. The server keeps the API key private and calls Gemma 4 through Gemini API. Structured results return to the browser. GitHub Pages hosts a static sample preview only.</desc>
 <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#88a174"/></marker></defs><rect width="1500" height="600" rx="24" fill="#f6f5f0"/><text x="70" y="68" fill="#28573e" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">UNDER THE HOOD</text><text x="70" y="108" fill="#20251f" font-family="Arial,sans-serif" font-size="26" font-weight="700">Small, clear, and careful with the API key</text>
 <g transform="translate(70 174)"><rect width="300" height="214" rx="17" fill="#fffefa" stroke="#dfe0d6"/><rect x="25" y="25" width="54" height="40" rx="8" fill="#e9f0e1"/><text x="39" y="51" fill="#28573e" font-family="Arial,sans-serif" font-size="21">▤</text><text x="25" y="102" fill="#20251f" font-family="Arial,sans-serif" font-size="18" font-weight="700">Browser interface</text><text x="25" y="132" fill="#70786d" font-family="Arial,sans-serif" font-size="12">HTML · CSS · JavaScript</text><text x="25" y="159" fill="#70786d" font-family="Arial,sans-serif" font-size="12">Notice text or photo + language</text><text x="25" y="183" fill="#70786d" font-family="Arial,sans-serif" font-size="12">Displays the returned clarity card</text></g>
 <path d="M390 280h130" stroke="#88a174" stroke-width="3" marker-end="url(#arrow)"/><text x="417" y="258" fill="#73806b" font-family="Arial,sans-serif" font-size="10">local request</text>
 <g transform="translate(550 174)"><rect width="360" height="214" rx="17" fill="#fffefa" stroke="#dfe0d6"/><rect x="25" y="25" width="54" height="40" rx="8" fill="#e9f0e1"/><text x="41" y="52" fill="#28573e" font-family="Arial,sans-serif" font-size="18">{ }</text><text x="25" y="102" fill="#20251f" font-family="Arial,sans-serif" font-size="18" font-weight="700">Node.js server</text><text x="25" y="132" fill="#70786d" font-family="Arial,sans-serif" font-size="12">Validates request · prepares prompt</text><rect x="25" y="151" width="307" height="39" rx="7" fill="#f2f5ed"/><text x="39" y="175" fill="#466046" font-family="Arial,sans-serif" font-size="11" font-weight="700">GEMINI_API_KEY stays in local .env</text></g>
 <path d="M930 280h128" stroke="#88a174" stroke-width="3" marker-end="url(#arrow)"/><text x="953" y="258" fill="#73806b" font-family="Arial,sans-serif" font-size="10">HTTPS · API key</text>
 <g transform="translate(1090 174)"><rect width="340" height="214" rx="17" fill="#28573e"/><rect x="25" y="25" width="54" height="40" rx="8" fill="#ffffff1c"/><text x="41" y="53" fill="#d3f278" font-family="Arial,sans-serif" font-size="18">✳</text><text x="25" y="102" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Gemma 4</text><text x="25" y="132" fill="#e3eadf" font-family="Arial,sans-serif" font-size="12">Gemini API · open-weight model</text><text x="25" y="159" fill="#e3eadf" font-family="Arial,sans-serif" font-size="12">Returns summary, actions, dates,</text><text x="25" y="180" fill="#e3eadf" font-family="Arial,sans-serif" font-size="12">requirements, and uncertainty flags</text></g>
 <path d="M1270 412v64H220v-66" fill="none" stroke="#88a174" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="632" y="501" fill="#73806b" font-family="Arial,sans-serif" font-size="11">structured result returns to the browser</text>
 <rect x="70" y="526" width="1360" height="48" rx="9" fill="#e9eee3"/><text x="91" y="555" fill="#28573e" font-family="Arial,sans-serif" font-size="12" font-weight="700">PUBLIC DEMO</text><text x="199" y="555" fill="#5d695b" font-family="Arial,sans-serif" font-size="12">GitHub Pages hosts the static sample preview. Live analysis runs through the local Node.js server; no API key is shipped to the browser.</text>
</svg>
