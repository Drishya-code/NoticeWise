<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">NoticeWise — Make the fine print make sense</title>
  <desc id="desc">A calm editorial cover introducing NoticeWise, an AI assistant that turns public notices into clear next steps.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f6f5f0"/><stop offset="1" stop-color="#e9eee3"/></linearGradient><filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#20382a" flood-opacity=".13"/></filter></defs>
  <rect width="1600" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="1310" cy="35" r="230" fill="#d9e5d0" opacity=".54"/><circle cx="1510" cy="410" r="190" fill="#e5efcb" opacity=".68"/>
  <g transform="translate(100 83)"><rect width="44" height="44" rx="13" fill="#28573e"/><text x="10" y="29" fill="#d3f278" font-family="Arial,sans-serif" font-size="17" font-weight="800">N<tspan fill="#fff">W</tspan></text><text x="58" y="28" fill="#20251f" font-family="Arial,sans-serif" font-size="20" font-weight="700">NoticeWise</text></g>
  <g transform="translate(100 183)"><text fill="#28573e" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">PUBLIC NOTICES, MADE HUMAN</text><text y="94" fill="#20251f" font-family="Arial,sans-serif" font-size="74" font-weight="800" letter-spacing="-4">Make the fine print</text><text y="172" fill="#28573e" font-family="Georgia,serif" font-size="80" font-style="italic" letter-spacing="-4">make sense.</text><text y="224" fill="#687166" font-family="Arial,sans-serif" font-size="19">Clear summaries. Useful dates. Next steps you can verify.</text></g>
  <g transform="translate(965 83) rotate(2 240 170)" filter="url(#shadow)"><rect width="490" height="337" rx="19" fill="#fffefa" stroke="#dedfd5"/><path d="M19 0h452a19 19 0 0 1 19 19v31H0V19A19 19 0 0 1 19 0" fill="#f0f1ea"/><circle cx="25" cy="25" r="5" fill="#e78467"/><circle cx="43" cy="25" r="5" fill="#e4be63"/><circle cx="61" cy="25" r="5" fill="#8eb384"/><text x="85" y="30" fill="#798176" font-family="Arial,sans-serif" font-size="10">NOTICEWISE · CLARITY CARD</text>
    <text x="30" y="88" fill="#28573e" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">YOUR CLARITY CARD</text><text x="30" y="122" fill="#20251f" font-family="Arial,sans-serif" font-size="25" font-weight="700">Apply for fee support</text><rect x="30" y="143" width="430" height="1" fill="#e6e7de"/><text x="30" y="174" fill="#28573e" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">IN SHORT</text><text x="30" y="199" fill="#5e675c" font-family="Arial,sans-serif" font-size="13">Eligible undergraduates can apply for fee support.</text><text x="30" y="218" fill="#5e675c" font-family="Arial,sans-serif" font-size="13">Submit the form and documents by 14 November.</text>
    <text x="30" y="255" fill="#20251f" font-family="Arial,sans-serif" font-size="13" font-weight="700">What to do</text><rect x="30" y="268" width="430" height="47" rx="7" fill="#f3f5ef"/><rect x="30" y="268" width="3" height="47" rx="2" fill="#8faa72"/><text x="45" y="287" fill="#364035" font-family="Arial,sans-serif" font-size="11" font-weight="700">Submit form, income certificate, and student ID</text><text x="45" y="304" fill="#687166" font-family="Arial,sans-serif" font-size="10">14 Nov 2026 · 5:00 PM</text></g>
  <g transform="translate(1320 73)"><circle r="36" fill="#d3f278"/><text x="-12" y="12" fill="#28573e" font-family="Arial,sans-serif" font-size="32">✳</text></g>
  <text x="100" y="440" fill="#778074" font-family="Arial,sans-serif" font-size="13">OPEN SOURCE  ·  GEMMA 4  ·  BUILT FOR EVERYDAY CLARITY</text>
