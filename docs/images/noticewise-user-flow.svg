<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="440" viewBox="0 0 1500 440" role="img" aria-labelledby="title desc">
 <title id="title">NoticeWise user flow</title><desc id="desc">The user adds notice text or a photo, selects a language, gets a clarity card from Gemma 4, and verifies each action against source evidence.</desc>
 <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#88a174"/></marker></defs><rect width="1500" height="440" rx="24" fill="#f6f5f0"/><text x="70" y="69" fill="#28573e" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">A SIMPLE PATH FROM NOTICE TO NEXT STEP</text><text x="70" y="108" fill="#20251f" font-family="Arial,sans-serif" font-size="26" font-weight="700">From “what does this mean?” to “I know what to do.”</text>
 <path d="M345 247h88M695 247h88M1045 247h88" stroke="#88a174" stroke-width="3" marker-end="url(#arrow)"/>
 <g transform="translate(70 153)"><rect width="275" height="188" rx="16" fill="#fffefa" stroke="#dfe0d6"/><circle cx="37" cy="38" r="22" fill="#e9f0e1"/><text x="30" y="44" fill="#28573e" font-family="Arial,sans-serif" font-size="15" font-weight="700">01</text><text x="28" y="91" fill="#20251f" font-family="Arial,sans-serif" font-size="18" font-weight="700">Add a notice</text><text x="28" y="120" fill="#70786d" font-family="Arial,sans-serif" font-size="12">Paste the text or upload</text><text x="28" y="139" fill="#70786d" font-family="Arial,sans-serif" font-size="12">a photo of the circular.</text><rect x="28" y="154" width="84" height="20" rx="5" fill="#f2f4ed"/><text x="38" y="168" fill="#5f6b58" font-family="Arial,sans-serif" font-size="9">TEXT  ·  IMAGE</text></g>
 <g transform="translate(420 153)"><rect width="275" height="188" rx="16" fill="#fffefa" stroke="#dfe0d6"/><circle cx="37" cy="38" r="22" fill="#e9f0e1"/><text x="30" y="44" fill="#28573e" font-family="Arial,sans-serif" font-size="15" font-weight="700">02</text><text x="28" y="91" fill="#20251f" font-family="Arial,sans-serif" font-size="18" font-weight="700">Choose a language</text><text x="28" y="120" fill="#70786d" font-family="Arial,sans-serif" font-size="12">Pick how you want the</text><text x="28" y="139" fill="#70786d" font-family="Arial,sans-serif" font-size="12">main points explained.</text><rect x="28" y="154" width="115" height="20" rx="5" fill="#f2f4ed"/><text x="38" y="168" fill="#5f6b58" font-family="Arial,sans-serif" font-size="9">EN  हिन्दी  தமிழ்</text></g>
 <g transform="translate(770 153)"><rect width="275" height="188" rx="16" fill="#fffefa" stroke="#dfe0d6"/><circle cx="37" cy="38" r="22" fill="#e9f0e1"/><text x="30" y="44" fill="#28573e" font-family="Arial,sans-serif" font-size="15" font-weight="700">03</text><text x="28" y="91" fill="#20251f" font-family="Arial,sans-serif" font-size="18" font-weight="700">Gemma 4 finds</text><text x="28" y="120" fill="#70786d" font-family="Arial,sans-serif" font-size="12">The audience, actions,</text><text x="28" y="139" fill="#70786d" font-family="Arial,sans-serif" font-size="12">dates, and requirements.</text><rect x="28" y="154" width="101" height="20" rx="5" fill="#e9f0e1"/><text x="39" y="168" fill="#3f6948" font-family="Arial,sans-serif" font-size="9">OPEN-WEIGHT AI</text></g>
 <g transform="translate(1120 153)"><rect width="310" height="188" rx="16" fill="#28573e"/><circle cx="37" cy="38" r="22" fill="#d3f278"/><text x="30" y="44" fill="#28573e" font-family="Arial,sans-serif" font-size="15" font-weight="700">04</text><text x="28" y="91" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Check and act</text><text x="28" y="120" fill="#e3eadf" font-family="Arial,sans-serif" font-size="12">Review the action list,</text><text x="28" y="139" fill="#e3eadf" font-family="Arial,sans-serif" font-size="12">dates, and source quotes.</text><rect x="28" y="154" width="157" height="20" rx="5" fill="#ffffff1c"/><text x="39" y="168" fill="#d3f278" font-family="Arial,sans-serif" font-size="9">VERIFY WITH ORIGINAL</text></g>
 <text x="70" y="392" fill="#777f73" font-family="Arial,sans-serif" font-size="11">Unclear details are surfaced for confirmation instead of being guessed.</text>
</svg>
